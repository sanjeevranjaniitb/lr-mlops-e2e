name: Train & Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "configs/**"
      - "requirements.txt"
  workflow_dispatch:  # Allow manual trigger
  schedule:
    - cron: "0 6 * * 1"  # Weekly retraining on Mondays at 6 AM UTC

permissions:
  contents: write
  packages: write

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run training pipeline
        run: python -m src.models.train

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: models/
          retention-days: 30

      - name: Run smoke test on model
        run: |
          python -c "
          import joblib, json, numpy as np
          model = joblib.load('models/model.joblib')
          scaler = joblib.load('models/scaler.joblib')
          with open('models/metadata.json') as f:
              meta = json.load(f)
          X = np.random.randn(1, len(meta['feature_names']))
          X_scaled = scaler.transform(X)
          pred = model.predict(X_scaled)
          assert pred.shape == (1,), f'Expected shape (1,), got {pred.shape}'
          print(f'Smoke test passed. Prediction: {pred[0]:.4f}')
          "

  build-and-push:
    needs: train
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.serve
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    needs: [train, build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: model-${{ github.run_number }}
          name: "Model Release #${{ github.run_number }}"
          body: |
            Automated model release from training pipeline.
            Commit: ${{ github.sha }}
          files: |
            models/model.joblib
            models/scaler.joblib
            models/metadata.json
